[package]
name = "reelsmith-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reelsmith-time = { workspace = true }
reelsmith-geom = { workspace = true }
reelsmith-color = { workspace = true }
reelsmith-frame = { workspace = true }
reelsmith-media = { workspace = true }
reelsmith-project = { workspace = true }
reelsmith-audio-dsp = { workspace = true }
reelsmith-captions = { workspace = true }
reelsmith-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
