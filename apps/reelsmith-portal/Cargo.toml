[package]
name = "reelsmith-portal"
description = "ReelSmith review portal: per-client projects, the real editor on review links, server replay of an append-only action log, and resumable uploads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "reelsmith_portal"
path = "src/lib.rs"

[[bin]]
name = "reelsmith-portal"
path = "src/main.rs"

[dependencies]
reelsmith-time = { workspace = true }
reelsmith-engine = { workspace = true }
reelsmith-format = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
